name: relaxiz
description: relaxiZ - a calm space to just be.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Firebase
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0

  # Animations
  flutter_animate: ^4.3.0
  lottie: ^3.0.0

  # Audio
  just_audio: ^0.9.36
  audio_session: ^0.1.18

  # UI & utils
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.9
  smooth_page_indicator: ^1.1.0
  go_router: ^12.1.3
  timeago: ^3.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
    - assets/lottie/
